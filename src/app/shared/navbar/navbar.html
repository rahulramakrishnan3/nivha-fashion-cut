<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="container navbar-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <span class="brand-mark">N</span>
      <span class="brand-text">
        <strong>Nivha</strong>
        <small>By Fashion Cut</small>
      </span>
    </a>

    <nav class="nav-links" [class.open]="isMenuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>
      <a href="tel:+919947365696" class="btn btn-primary nav-cta">Book Appointment</a>
    </nav>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
